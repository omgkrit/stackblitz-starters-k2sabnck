
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Micro Facts Trainer</title>
  <link rel="stylesheet" href="styles.css">

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="a-math-icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Micro Facts">
</head>
<body>

<div class="container">

  <header class="page-header">
    <div>
  <h1>🧠 Micro Facts Trainer</h1>
      <p class="page-intro">ฝึกโจทย์ทีละข้อ ตอบด้วยแป้นตัวเลข แล้วติดตามความแม่นยำของคุณ</p>
    </div>
    <a href="table.html" class="nav-btn">📖 ดูสูตรคูณ</a>
  </header>
  
  <div class="controls">
    <div class="section-heading">
      <h2>เลือกโจทย์ที่จะฝึก</h2>
      <p>เลือกชุดเลขได้มากกว่าหนึ่งชุด</p>
    </div>

    <label class="multiplier-setting">
      <span>ตัวคูณ</span>
      <span class="input-pair">
        <span>ตั้งแต่</span>
        <input id="minMultiplier" type="number" inputmode="numeric" value="4" aria-label="ตัวคูณเริ่มต้น">
        <span>ถึง</span>
        <input id="maxMultiplier" type="number" inputmode="numeric" value="9" aria-label="ตัวคูณสิ้นสุด">
      </span>
    </label>

    <div class="range-heading"><span>ชุดเลข</span><span id="rangeSummary" aria-live="polite"></span></div>
    <div id="ranges"></div>

  </div>

  <section class="training-area" aria-label="พื้นที่ฝึก">
    <button id="startBtn">เริ่มฝึก</button>

    <div class="question-panel">
      <div id="question">กดเริ่มฝึกเพื่อรับโจทย์</div>
      <div id="feedback"></div>
    </div>

    <div class="answer-panel">
      <p class="keypad-hint">แตะตัวเลข แล้วกด ↵ เพื่อส่งคำตอบ</p>
      <input
        id="answer"
        type="number"
        inputmode="none"
        placeholder="คำตอบ"
        autocomplete="off"
      >
    </div>

    <div id="numpad">
      <button class="num-btn" data-key="1">1</button>
      <button class="num-btn" data-key="2">2</button>
      <button class="num-btn" data-key="3">3</button>

      <button class="num-btn" data-key="4">4</button>
      <button class="num-btn" data-key="5">5</button>
      <button class="num-btn" data-key="6">6</button>

      <button class="num-btn" data-key="7">7</button>
      <button class="num-btn" data-key="8">8</button>
      <button class="num-btn" data-key="9">9</button>

      <button class="num-btn delete-btn" data-key="backspace">⌫</button>
      <button class="num-btn" data-key="0">0</button>
      <button class="num-btn enter-btn" data-key="enter">↵</button>
    </div>

    <div class="stats">
      <div id="accuracy">Accuracy: 0%</div>
      <div id="average">Average: 0.00 s</div>
      <div id="streak">Streak: 0</div>
    </div>
  </section>

</div>

<script src="script.js?v=3"></script>

</body>
</html>
